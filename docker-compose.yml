services:
  db:
    image: postgres:15
    container_name: superestagios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: superestagios
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: